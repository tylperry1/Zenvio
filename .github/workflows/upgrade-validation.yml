name: Upgrade validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-fixture-password
          POSTGRES_DB: zenvio_upgrade_fixture
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:isolated-fixture-password@localhost:5432/zenvio_upgrade_fixture
      TEST_DATABASE_URL: postgresql://postgres:isolated-fixture-password@localhost:5432/zenvio_upgrade_fixture
      BETTER_AUTH_SECRET: isolated-upgrade-secret-12345678901234567890
      BETTER_AUTH_URL: http://localhost:3100
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      TEST_APP_URL: http://localhost:3100
      MASTER_ADMIN_EMAIL: owner@example.com
      MASTER_ADMIN_SETUP_TOKEN: isolated-upgrade-owner-token-123456789
      TEST_OWNER_TOKEN: isolated-upgrade-owner-token-123456789
      INTEGRATION_ENCRYPTION_KEY: isolated-upgrade-encryption-secret-123456789
      WAITLIST_OFFERS_ENABLED: "true"
      TEST_REAL_POSTGRES: "true"
      CRON_SECRET: isolated-upgrade-job-runner-secret
      # The assistant talks to the scripted mock model started by the 2.1 tests, never the real API.
      ANTHROPIC_BASE_URL: http://127.0.0.1:4010
      ANTHROPIC_API_KEY: isolated-mock-model-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: node tests/upgrade-migrations.integration.mjs
      - run: npm run build
      # Gelato end-to-end flow on the migrated fixture database (scripted supplier API, no credentials).
      - run: node tests/gelato.integration.mjs
      - run: npm run typecheck
      - name: Start isolated application
        run: |
          npm start -- --hostname localhost --port 3100 > /tmp/zenvio-fixture-server.log 2>&1 &
          for n in $(seq 1 30); do curl -fsS http://localhost:3100/sign-in > /dev/null && break; sleep 1; done
      - run: node tests/launch.integration.mjs
      - run: node tests/upgrade.integration.mjs
      - run: node tests/upgrade.browser.mjs
      - run: node tests/experience.integration.mjs
      - run: node tests/experience.browser.mjs
      - run: node tests/qa.browser.mjs
      - run: node tests/staff-access.integration.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-browser-results
          path: test-results/

  legacy-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-fixture-password
          POSTGRES_DB: zenvio_upgrade_fixture
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:isolated-fixture-password@localhost:5432/zenvio_upgrade_fixture
      TEST_DATABASE_URL: postgresql://postgres:isolated-fixture-password@localhost:5432/zenvio_upgrade_fixture
      BETTER_AUTH_SECRET: isolated-upgrade-secret-12345678901234567890
      BETTER_AUTH_URL: http://localhost:3100
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      TEST_APP_URL: http://localhost:3100
      MASTER_ADMIN_EMAIL: owner@example.com
      MASTER_ADMIN_SETUP_TOKEN: isolated-upgrade-owner-token-123456789
      TEST_OWNER_TOKEN: isolated-upgrade-owner-token-123456789
      INTEGRATION_ENCRYPTION_KEY: isolated-upgrade-encryption-secret-123456789
      WAITLIST_OFFERS_ENABLED: "true"
      TEST_REAL_POSTGRES: "true"
      CRON_SECRET: isolated-upgrade-job-runner-secret
      # The assistant talks to the scripted mock model started by the 2.1 tests, never the real API.
      ANTHROPIC_BASE_URL: http://127.0.0.1:4010
      ANTHROPIC_API_KEY: isolated-mock-model-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: node tests/upgrade-migrations.integration.mjs
      - run: npm run build
      - run: npm run typecheck
      - name: Start isolated application
        run: |
          npm start -- --hostname localhost --port 3100 > /tmp/zenvio-fixture-server.log 2>&1 &
          for n in $(seq 1 30); do curl -fsS http://localhost:3100/sign-in > /dev/null && break; sleep 1; done
      - name: Legacy account fixture
        run: node tests/accounts.integration.mjs
      - name: Legacy document fixture
        if: ${{ !cancelled() }}
        run: node tests/documents.integration.mjs
      - name: Legacy envelope fixture
        if: ${{ !cancelled() }}
        run: node tests/envelopes.integration.mjs
      - name: Google provider fixture
        if: ${{ !cancelled() }}
        run: node tests/google-calendar.integration.mjs
      - name: Marketplace provider fixture
        if: ${{ !cancelled() }}
        run: node tests/marketplace.integration.mjs
